---
layout: default
---
<main id="main-content" class="ssketch-project">
  <article>
    <header class="ssketch-hero page-container">
      <nav class="breadcrumbs" aria-label="현재 위치"><ol><li><a href="{{ '/projects/' | relative_url }}">프로젝트</a></li><li aria-current="page">SSketch</li></ol></nav>
      <div class="ssketch-hero__grid">
        <div class="ssketch-hero__copy">
          <p class="ssketch-eyebrow">SSAFY 15기 · 특화 프로젝트 · D204</p>
          <img class="ssketch-logo" src="{{ '/assets/images/projects/ssketch/logo-day.png' | relative_url }}" alt="SSketch — Draw Together, Play Together" width="1400" height="481">
          <h1>{{ page.hero_heading }}</h1>
          <p class="ssketch-intro">{{ page.hero_intro }}</p>
          <ul class="ssketch-chips" aria-label="게임 정보"><li>4인 온라인</li><li>Windows</li><li>Unity · C++</li></ul>
          <div class="ssketch-actions">
            <a class="ssketch-button" href="{{ '/projects/ssketch/details/' | relative_url }}">구현 내용 목록 보기 <span aria-hidden="true">→</span></a>
            <a class="ssketch-button ssketch-button--secondary" href="https://ssketch.ddns.net/" target="_blank" rel="noopener noreferrer">게임 소개 · 다운로드 <span aria-hidden="true">↗</span></a>
          </div>
        </div>
        <figure class="ssketch-hero__art">
          <img src="{{ '/assets/images/projects/ssketch/presentation-game-loop.png' | relative_url }}" alt="낮에는 그림을 그리고 밤에는 훔치고 아침에는 평가하는 세 단계의 게임 소개 일러스트" width="1448" height="1086" fetchpriority="high">
          <figcaption>낮, 밤, 아침의 게임 흐름을 표현한 소개 일러스트</figcaption>
        </figure>
      </div>
    </header>
    <nav class="ssketch-section-nav page-container" aria-label="프로젝트 목차"><a href="#game">게임 소개</a><a href="#role">담당 역할</a><a href="#development">개발 기록</a><a href="#evidence">검증 기록</a><a href="#improvements">개선 예정</a></nav>
    <div class="page-container ssketch-main-content">{{ content }}</div>
    <nav class="project-pagination page-container" aria-label="프로젝트 이동"><a href="{{ '/projects/' | relative_url }}"><span>모든 프로젝트</span><strong>목록으로 돌아가기</strong></a></nav>
  </article>
</main>
