<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="{{ page.description | default: page.summary | default: site.description | strip_html | normalize_whitespace | escape }}"
    >
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f7f6f2">
    <link rel="icon" href="{{ '/assets/images/common/favicon.svg' | relative_url }}" type="image/svg+xml">
    <title>
      {% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} — {{ site.title }}{% endif %}
    </title>
    <script>document.documentElement.classList.add("js");</script>
    <link rel="stylesheet" href="{{ '/assets/css/shared.css' | relative_url }}{% if page.asset_version %}?v={{ page.asset_version }}{% endif %}">
    {% if page.game_portfolio or page.game_portfolio_index %}<link rel="stylesheet" href="{{ '/assets/css/game-portfolio.css' | relative_url }}">{% endif %}
    {% if page.game_portfolio %}<script src="{{ '/assets/js/game-media-gallery.js' | relative_url }}" defer></script>{% endif %}
    <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
    {% if page.ssketch_styles %}<link rel="stylesheet" href="{{ '/assets/css/ssketch.css' | relative_url }}">{% endif %}
    <script
      src="{{ '/assets/js/mermaid-loader.js' | relative_url }}"
      data-mermaid-src="{{ '/assets/vendor/mermaid/mermaid.min.js' | relative_url }}"
      defer
    ></script>
    <script src="{{ '/assets/js/code-copy.js' | relative_url }}" defer></script>
    {% if page.project_filter %}
      <script src="{{ '/assets/js/project-filter.js' | relative_url }}{% if page.asset_version %}?v={{ page.asset_version }}{% endif %}" defer></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
  </body>
</html>
