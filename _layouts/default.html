<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="{{ page.description | default: page.summary | default: site.description | strip_html | normalize_whitespace | escape }}"
    >
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050505">
    <title>
      {% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} — {{ site.title }}{% endif %}
    </title>
    <script>document.documentElement.classList.add("js");</script>
    <link rel="stylesheet" href="{{ '/assets/css/shared.css' | relative_url }}">
    <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
    {% if page.project_filter %}
      <script src="{{ '/assets/js/project-filter.js' | relative_url }}" defer></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
  </body>
</html>
