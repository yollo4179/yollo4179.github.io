title: Portfolio
description: 프로젝트에서 배운 것과 문제 해결 과정을 기록하는 개발 포트폴리오입니다.
lang: ko
url: "https://yollo4179.github.io"
baseurl: ""
timezone: Asia/Seoul

markdown: kramdown
permalink: pretty

collections:
  projects:
    output: true
    permalink: /projects/:name/
  details:
    output: true

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: details
    values:
      layout: detail

exclude:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - 내정보.txt
  - VEDEOS/cuda_12.9.1_576.57_windows.exe
  - VEDEOS/Samsung_Metaverse_SkeletonCode.zip
  - VEDEOS/MoraiLauncher_Win.zip
  - VEDEOS/SSAFY_FILE.zip
  - debug.log
